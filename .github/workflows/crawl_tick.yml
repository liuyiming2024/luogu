name: 全量爬取 · Actions 错峰 tick

# 「爬取放在那边」：爬取的主路径就在 GitHub Actions，正文直接 commit 回仓库。
# 对拍不放这里（tools/verify_pipeline.py 在本地跑），网页由 pages.yml 发布。
#
# 节奏：每天 4 次错峰（UTC 1/7/13/19 点的第 17 分，避开整点），
# 每次随机起步延迟 0~150s，单次约 3 分钟 / 最多 30 个请求，
# 请求间隔 2.0~3.5s 抖动 + 每 20 次小憩；403/429/降级公告即长退避。
# 不是「恒定 2 秒一直爬」。每月约 4×30×3 = 360 分钟，在私有/公开仓库额度内。
on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      max_requests:
        description: '本轮最多请求数（手动可加大）'
        required: true
        default: '30'
        type: string
      seed_problems:
        description: 'P 号顺序范围（如 1000:1010），留空则用主表待补队列'
        required: false
        default: ''
        type: string
      refresh_url:
        description: '保存站刷新入口（可选；留空则直爬洛谷）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: luogu-crawl
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 随机起步延迟（不固定准点）
        run: python3 -c "import time,random; t=random.uniform(0,150); print('sleep',round(t,1),'s'); time.sleep(t)"

      - name: 低频 tick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_REQ: ${{ inputs.max_requests || '30' }}
          SEED: ${{ inputs.seed_problems }}
          REFRESH: ${{ inputs.refresh_url }}
        run: |
          set -u
          args=(--max-requests "$MAX_REQ" --run-minutes 3 --rest-minutes 0
                --push-every 30 --delay 2.0 --jitter 1.5 --micro-batch 20
                --micro-rest 20 --max-depth 2)
          [ -n "$SEED" ] && args+=(--seed-problems "$SEED")
          [ -n "$REFRESH" ] && args+=(--refresh-url "$REFRESH")
          echo "执行: python3 tools/crawl_daemon.py ${args[*]}"
          python3 tools/crawl_daemon.py "${args[@]}" || echo "daemon 返回非零（多为被拒长退避），日志已保留"

      - name: 重生成来源署名与归档站
        run: |
          python3 tools/provenance.py
          python3 _build_site.py

      - name: 提交取回结果（含署名与网页产物）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "luogu-crawler[bot]"
          git config user.email "luogu-crawler[bot]@users.noreply.github.com"
          git add -A -- site/ 02_文章编号索引/
          if git diff --cached --quiet; then
            echo "无新产物，跳过提交"
          else
            git commit -m "crawl tick: 取回+署名+重生成 $(date -u +%Y-%m-%dT%H:%MZ) run ${{ github.run_number }}"
            git pull --rebase origin main || true
            git push
          fi

      - name: 上传取回日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-tick-log-${{ github.run_number }}
          path: |
            02_文章编号索引/取回日志.jsonl
            02_文章编号索引/爬取进度.md
          if-no-files-found: ignore

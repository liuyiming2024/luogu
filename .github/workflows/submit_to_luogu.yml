name: 代提交 luogu · 自动（免本人提交）

# 「你在 hub 写个 action，帮我提交 luogu」+「我本人就不用提交」
#
# 本人**一次性**在 Settings → Secrets 写入 LUOGU_SUBMIT_CONSENT，
# 之后 push(outbox 变化) / 定时即自动低频代提交，无需手动 dispatch、
# 无需每次填确认值、无需本人点任何按钮。
#
# 未配置 consent → **永远只预览**，不向洛谷发任何写请求（安全默认）。
#
# 硬约束：
#  - 凭据只从 Settings → Secrets 读，绝不进仓库、绝不打印
#  - 只处理前端「我自担」确认门写入 confirmed=true 的条目
#  - 低频：2.0~3.5s 抖动、每 20 次小憩、403/降级即停、失败不轰炸重试、幂等
#  - 后果由本人自行确认并自行承担；本项目不代持会话、不认人只认 token

on:
  push:
    branches: [main]
    paths:
      - 'site/data/outbox/**'
      - 'tools/luogu_submit.py'
  schedule:
    # 错峰兜底：重试「失败待重试」条目；幂等保证不会重复提交
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'comment / publish / judge / all'
        required: true
        default: 'all'
        type: choice
        options: [all, comment, publish, judge]
      force_dry_run:
        description: 'true = 本轮强制只预览（调试用）'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
  workflow_call:

permissions:
  contents: write

concurrency:
  group: luogu-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 判定是否允许真提交（一次性授权）
        id: gate
        env:
          CONSENT: ${{ secrets.LUOGU_SUBMIT_CONSENT }}
          FORCE_DRY: ${{ inputs.force_dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          ALLOW=0
          # 一次性授权：Secret 里存了确认值即长期生效，本人不必再操作
          if [ "$CONSENT" = "I_UNDERSTAND_AND_ACCEPT_ALL_RISK" ]; then
            ALLOW=1
          fi
          # 手动调试可强制预览
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE_DRY" = "true" ]; then
            ALLOW=0
          fi
          echo "allow=$ALLOW" >> "$GITHUB_OUTPUT"
          if [ "$ALLOW" = "1" ]; then
            echo "本人已完成一次性授权并自担后果；本轮自动低频代提交 luogu"
          else
            echo "未配置 LUOGU_SUBMIT_CONSENT（或强制预览）→ 本轮仅预览，不向洛谷发任何写请求"
          fi

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行待推队列
        id: run
        env:
          LUOGU_COOKIE: ${{ secrets.LUOGU_COOKIE }}
          LUOGU_CSRF: ${{ secrets.LUOGU_CSRF }}
          LUOGU_UID: ${{ secrets.LUOGU_UID }}
          LUOGU_SUBMIT_ENDPOINT: ${{ secrets.LUOGU_SUBMIT_ENDPOINT }}
          LUOGU_IDE_ENDPOINT: ${{ vars.LUOGU_IDE_ENDPOINT }}
          # 第 15 条预留位：未配置即空字符串，token_store 默认关闭，行为不变
          LUOGU_TOKEN_STORE: ${{ vars.LUOGU_TOKEN_STORE }}
          LUOGU_TOKEN_BACKEND: ${{ vars.LUOGU_TOKEN_BACKEND }}
          LUOGU_TOKEN_TABLE: ${{ vars.LUOGU_TOKEN_TABLE }}
          LUOGU_TOKEN_SUPABASE_URL: ${{ vars.LUOGU_TOKEN_SUPABASE_URL }}
          LUOGU_TOKEN_SUPABASE_KEY: ${{ secrets.LUOGU_TOKEN_SUPABASE_KEY }}
          LUOGU_TOKEN_DSN: ${{ secrets.LUOGU_TOKEN_DSN }}
          ALLOW_REAL: ${{ steps.gate.outputs.allow }}
          SUBMIT_KIND: ${{ inputs.kind }}
        run: |
          ARGS="--kind ${SUBMIT_KIND:-all}"
          if [ "$ALLOW_REAL" != "1" ]; then ARGS="$ARGS --dry-run"; fi
          python3 tools/luogu_submit.py $ARGS
          SENT=$(python3 -c "import json;print(json.load(open('site/data/outbox/_状态.json',encoding='utf-8'))['实际发出'])")
          echo "sent=$SENT" >> "$GITHUB_OUTPUT"

      - name: 回写队列状态（仅真提交且确有发出）
        # 预览 / 零条目的轮次绝不写回仓库，避免与本人推送产生竞态和无意义提交
        if: steps.gate.outputs.allow == '1' && steps.run.outputs.sent != '0'
        run: |
          git config user.name "luogu-submit-bot"
          git config user.email "luogu-submit-bot@users.noreply.github.com"
          git add site/data/outbox/ || true
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "代提交 luogu：自动回写待推队列状态（无凭据入库）"
            git pull --rebase origin main
            git push
          fi

      - name: 清理预览轮次的状态文件改动
        if: steps.gate.outputs.allow != '1' || steps.run.outputs.sent == '0'
        run: git checkout -- site/data/outbox/_状态.json || true

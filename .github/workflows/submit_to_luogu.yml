name: 代提交 luogu · 需本人确认

# 「你在 hub 写个 action，帮我提交 luogu」
# GitHub 提供的 runner 就是运行态，不需要静态 Pages 自带服务端；
# 使用者也可自行下载本机运行态（见《架构可达性测试报告》）。
#
# 硬约束：
#  - 凭据只从 Settings → Secrets 读，绝不进仓库、绝不打印
#  - 只有 workflow_dispatch 且确认值正确才「真提交」；
#    push / schedule 一律只预览（dry-run），不碰洛谷
#  - 用户自行确认并自行承担后果；本项目不代持会话、不认人只认 token
#  - 低频：2.0~3.5s 抖动、每 20 次小憩、403/降级即停、失败不轰炸重试

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 I_UNDERSTAND_AND_ACCEPT_ALL_RISK 才会真正提交；留空只预览'
        required: false
        default: ''
      kind:
        description: 'comment（评论）/ publish（发文）/ judge（洛谷 IDE 评测）/ all'
        required: true
        default: 'all'
        type: choice
        options: [all, comment, publish, judge]
      dry_run:
        description: 'true = 只预览不提交（默认）'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
  push:
    paths:
      - 'site/data/outbox/**'
  workflow_call:

permissions:
  contents: write

concurrency:
  group: luogu-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 判定是否允许真提交
        id: gate
        env:
          CONFIRM: ${{ inputs.confirm }}
          DRY: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          ALLOW=0
          if [ "$EVENT" = "workflow_dispatch" ] && \
             [ "$CONFIRM" = "I_UNDERSTAND_AND_ACCEPT_ALL_RISK" ] && \
             [ "$DRY" = "false" ]; then
            ALLOW=1
          fi
          echo "allow=$ALLOW" >> "$GITHUB_OUTPUT"
          if [ "$ALLOW" = "1" ]; then
            echo "::warning::本人已确认并自担后果；本轮将使用 Secrets 中的登录态向洛谷发起低频提交"
          else
            echo "未满足「手动触发 + 确认值 + dry_run=false」→ 本轮仅预览，不向洛谷发任何写请求"
          fi

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行待推队列（未确认则强制 dry-run）
        env:
          LUOGU_COOKIE: ${{ secrets.LUOGU_COOKIE }}
          LUOGU_CSRF: ${{ secrets.LUOGU_CSRF }}
          LUOGU_UID: ${{ secrets.LUOGU_UID }}
          LUOGU_SUBMIT_ENDPOINT: ${{ secrets.LUOGU_SUBMIT_ENDPOINT }}
          LUOGU_IDE_ENDPOINT: ${{ vars.LUOGU_IDE_ENDPOINT }}
          ALLOW_REAL: ${{ steps.gate.outputs.allow }}
          SUBMIT_KIND: ${{ inputs.kind }}
        run: |
          ARGS="--kind ${SUBMIT_KIND:-all}"
          if [ "$ALLOW_REAL" != "1" ]; then ARGS="$ARGS --dry-run"; fi
          python3 tools/luogu_submit.py $ARGS

      - name: 回写队列状态（仅本人确认过的手动真提交）
        # push / 定时触发只预览，绝不写回仓库，避免与其他自动提交产生竞态
        if: steps.gate.outputs.allow == '1'
        run: |
          git config user.name "luogu-submit-bot"
          git config user.email "luogu-submit-bot@users.noreply.github.com"
          git add site/data/outbox/ || true
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "代提交 luogu：回写待推队列状态（无凭据入库）"
            git push
          fi
